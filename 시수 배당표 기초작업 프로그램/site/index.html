<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="학년도별 교육과정 및 수업시수 관리 로컬 데이터 시제품">
<title>방산고 수업시수배당표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="./assets/styles.css?v=6.5.10">
<link rel="stylesheet" href="./assets/cloud.css?v=6.5.10">
<link rel="stylesheet" href="./assets/steps.css?v=6.5.10">
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand-area">
      <h1>수업시수배당표 <small id="yearLabel"></small></h1>
      <span id="saveState">불러오는 중…</span>
    </div>
    <div class="top-actions noprint">
      <button class="btn" id="btnUndo" data-gact="undo" title="방금 한 일 되돌리기 (Ctrl+Z)" disabled>↩ 되돌리기 <span id="undoCnt"></span></button>
      <button class="btn" id="btnRedo" data-gact="redo" title="되돌린 일 다시 하기 (Ctrl+Y)" disabled>↪ 다시 하기</button>
      <button class="btn" id="cgCloudButton" type="button" hidden>☁ 저장 연결</button>
      <button class="btn" data-gact="settings" title="결재란, 다른 컴퓨터로 옮기기, 학년도 기록">⚙ 설정</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<input type="file" id="fileAssign" accept=".xlsx,.xls" style="display:none">
<input type="file" id="filePyeonje" accept=".xlsx,.xls" style="display:none">
<input type="file" id="fileJson" accept=".json" style="display:none">
<input type="file" id="filePortfolio" accept=".json" style="display:none">

<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="cg-cloud-overlay" id="cgCloudOverlay" hidden>
  <section class="cg-cloud-dialog" role="dialog" aria-modal="true" aria-labelledby="cgCloudTitle">
    <div class="cg-cloud-heading"><div><h2 id="cgCloudTitle">여러 컴퓨터에서 함께 쓰기</h2><p></p></div>
      <button class="btn sm" id="cgCloudDismiss" type="button" aria-label="닫기">닫기 ✕</button></div>
    <div id="cgCloudBody"></div>
    <div id="cgCloudStatus" role="status" aria-live="polite"></div>
  </section>
</div>
<script src="./assets/bootstrap.js?v=6.5.10"></script>
<script src="./assets/storage.js?v=6.5.10"></script>
<script src="./assets/steps.js?v=6.5.10"></script>
<script src="./assets/app.js?v=6.5.10"></script>
<script src="./assets/cloud.js?v=6.5.10"></script>
</body>
</html>
